<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		html,
		body {
			height: 100%;
		}

		body {
			margin: 0;
			overflow: hidden;
			background: rgba(0, 0, 0, 1);
			-webkit-user-select: none;
			-moz-user-select: none;
			user-select: none;
			-webkit-touch-callout: none;
		}

		canvas {
			outline: none;
			display: block;
		}

		.spline-watermark,
		#spline-watermark,
		a[href*="spline.design"],
		div[class*="spline-watermark"],
		[class*="watermark"] {
			display: none !important;
			opacity: 0 !important;
			visibility: hidden !important;
			pointer-events: none !important;
			width: 0 !important;
			height: 0 !important;
		}

		/* Futuristic Cyberpunk HUD Overlay */
		#digitech-hud {
			position: absolute;
			inset: 0;
			pointer-events: none;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			z-index: 10;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			padding: 1.5rem;
			box-sizing: border-box;
			transition: opacity 0.3s ease;
		}

		/* When embedded in iframe (e.g. AuthPage), hide HUD to prevent collision with Login Card */
		body.is-embedded #digitech-hud {
			display: none !important;
		}

		.hud-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			width: 100%;
		}

		.hud-badge {
			display: inline-flex;
			align-items: center;
			gap: 0.5rem;
			padding: 0.4rem 0.9rem;
			background: rgba(15, 23, 42, 0.7);
			backdrop-filter: blur(12px);
			border: 1px solid rgba(6, 182, 212, 0.35);
			border-radius: 9999px;
			color: #38bdf8;
			font-size: 0.75rem;
			font-weight: 700;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			box-shadow: 0 0 15px rgba(6, 182, 212, 0.25);
		}

		.hud-dot {
			width: 0.5rem;
			height: 0.5rem;
			border-radius: 9999px;
			background: #00f0ff;
			box-shadow: 0 0 8px #00f0ff;
			animation: hudPulse 1.5s infinite;
		}

		@keyframes hudPulse {

			0%,
			100% {
				opacity: 1;
				transform: scale(1);
			}

			50% {
				opacity: 0.35;
				transform: scale(0.85);
			}
		}

		.hud-btn {
			pointer-events: auto;
			padding: 0.4rem 0.9rem;
			background: rgba(220, 38, 38, 0.15);
			border: 1px solid rgba(239, 68, 68, 0.5);
			border-radius: 0.375rem;
			color: #f87171;
			font-size: 0.7rem;
			font-weight: 700;
			letter-spacing: 0.05em;
			cursor: pointer;
			transition: all 0.2s ease;
			backdrop-filter: blur(8px);
		}

		.hud-btn:hover {
			background: rgba(239, 68, 68, 0.35);
			color: #fff;
			box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
		}

		.hud-middle {
			display: flex;
			justify-content: space-between;
			align-items: center;
			width: 100%;
		}

		.hud-card {
			background: rgba(15, 23, 42, 0.65);
			backdrop-filter: blur(14px);
			border: 1px solid rgba(56, 189, 248, 0.25);
			border-left: 3px solid #00f0ff;
			border-radius: 0.5rem;
			padding: 0.85rem 1.15rem;
			max-width: 190px;
			box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
		}

		.hud-card.hud-card-right {
			border-left: 1px solid rgba(239, 68, 68, 0.2);
			border-right: 3px solid #ef4444;
			text-align: right;
		}

		.hud-label {
			font-size: 0.65rem;
			color: #38bdf8;
			font-weight: 700;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		.hud-card.hud-card-right .hud-label {
			color: #f87171;
		}

		.hud-val {
			font-size: 1.15rem;
			font-weight: 900;
			color: #ffffff;
			margin: 0.2rem 0;
			letter-spacing: -0.02em;
		}

		.hud-card.hud-card-right .hud-val {
			color: #ef4444;
		}

		.hud-sub {
			font-size: 0.6rem;
			color: #94a3b8;
		}

		.hud-footer {
			display: flex;
			justify-content: space-between;
			align-items: center;
			width: 100%;
			font-size: 0.65rem;
			color: #64748b;
			letter-spacing: 0.05em;
			text-transform: uppercase;
			font-weight: 600;
		}

		#cyber-dots-canvas {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			pointer-events: none;
			z-index: 5;
			mix-blend-mode: screen;
		}
	</style>
	<title>DIGITECH - Robot Mascot</title>
	<link rel="icon" type="image/png" href="/favicon.png">
	<link rel="modulepreload" href="/js/runtime.js">
	<link rel="modulepreload" href="/js/three.module.js">

	<script type="importmap">
		{
			"imports": {
				"three": "/js/three.module.js",
				"three/addons/loaders/FontLoader.js": "/js/FontLoader.js",
				"three/addons/geometries/TextGeometry.js": "/js/TextGeometry.js",
				"@splinetool/runtime": "/js/runtime.js"
			}
		}
		</script>
</head>

<body>
	<canvas id="canvas3d"></canvas>
	<canvas id="cyber-dots-canvas"></canvas>

	<script type="module">
		import * as THREE from 'three';
		import { FontLoader } from 'three/addons/loaders/FontLoader.js';
		import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
		import { Application } from '@splinetool/runtime';
		window.__THREE__ = THREE;

		// Detect embedded iframe via URL param (reliable across all security contexts)
		// OR via window.self !== window.top (same-origin fallback)
		const _urlParams = new URLSearchParams(window.location.search);
		const _isEmbedded = _urlParams.get('embedded') === '1' || (() => { try { return window.self !== window.top; } catch { return true; } })();
		if (_isEmbedded) {
			document.body.classList.add('is-embedded');
		}

		const canvas = document.getElementById('canvas3d');
		const app = new Application(canvas);
		window.__splineApp = app;

		// Watermark Purge
		const purgeWatermark = () => {
			document.querySelectorAll('.spline-watermark, #spline-watermark, a[href*="spline.design"], div[class*="watermark"]').forEach(el => el.remove());
		};
		purgeWatermark();
		setInterval(purgeWatermark, 400);

		// Web Audio API Sci-Fi Synthesizer
		let audioEnabled = true;
		let audioCtx = null;
		function playBeep(freq = 600, duration = 0.08) {
			if (!audioEnabled) return;
			try {
				if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
				if (audioCtx.state === 'suspended') audioCtx.resume();
				const osc = audioCtx.createOscillator();
				const gain = audioCtx.createGain();
				osc.type = 'sine';
				osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
				osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + duration);
				gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
				gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
				osc.connect(gain);
				gain.connect(audioCtx.destination);
				osc.start();
				osc.stop(audioCtx.currentTime + duration);
			} catch (e) { }
		}

		const soundBtn = document.getElementById('soundToggle');
		if (soundBtn) {
			soundBtn.addEventListener('click', () => {
				audioEnabled = !audioEnabled;
				soundBtn.textContent = audioEnabled ? 'AUDIO: ON' : 'AUDIO: OFF';
				if (audioEnabled) playBeep(880, 0.1);
			});
		}

		// FPS Counter
		let frameCount = 0;
		let lastFpsUpdate = performance.now();
		const fpsCounterEl = document.getElementById('fpsCounter');

		// ────── 1. INTERACTIVE CYBER DOT GRID CANVAS (RED / CYAN PARTICLES) ──────
		const dotCanvas = document.getElementById('cyber-dots-canvas');
		const dotCtx = dotCanvas ? dotCanvas.getContext('2d') : null;

		function resizeDotCanvas() {
			if (!dotCanvas) return;
			const dpr = window.devicePixelRatio || 1;
			dotCanvas.width = window.innerWidth * dpr;
			dotCanvas.height = window.innerHeight * dpr;
			if (dotCtx) {
				dotCtx.setTransform(1, 0, 0, 1, 0, 0);
				dotCtx.scale(dpr, dpr);
			}
		}
		window.addEventListener('resize', resizeDotCanvas);
		resizeDotCanvas();

		const cols = 55;
		const rows = 34;

		const mousePos = {
			x: window.innerWidth / 2,
			y: window.innerHeight / 2,
			targetX: window.innerWidth / 2,
			targetY: window.innerHeight / 2
		};

		window.addEventListener('mousemove', (e) => {
			mousePos.targetX = e.clientX;
			mousePos.targetY = e.clientY;
		});

		window.addEventListener('message', (msg) => {
			if (msg.data && msg.data.type === 'PARENT_MOUSE_MOVE') {
				mousePos.targetX = msg.data.normX * window.innerWidth;
				mousePos.targetY = msg.data.normY * window.innerHeight;
			}
		});

		let gridTime = 0;
		const animateDotGrid = () => {
			requestAnimationFrame(animateDotGrid);
			if (!dotCtx) return;

			gridTime += 0.025;
			mousePos.x += (mousePos.targetX - mousePos.x) * 0.12;
			mousePos.y += (mousePos.targetY - mousePos.y) * 0.12;

			const w = window.innerWidth;
			const h = window.innerHeight;
			dotCtx.clearRect(0, 0, w, h);

			const spacingX = w / cols;
			const spacingY = h / rows;
			const cx = w / 2;
			const cy = h / 2;

			const influenceRadius = 240;

			for (let r = 0; r < rows; r++) {
				for (let c = 0; c < cols; c++) {
					const x = (c + 0.5) * spacingX;
					const y = (r + 0.5) * spacingY;

					// Mask center robot torso
					const distRobot = Math.hypot((x - cx) / (w * 0.15), (y - cy - h * 0.08) / (h * 0.32));
					if (distRobot < 1.0) continue;

					const dMouse = Math.hypot(x - mousePos.x, y - mousePos.y);

					let dotSize = 2.0;
					let rCol = 6, gCol = 182, bCol = 212, alpha = 0.28;

					if (dMouse < influenceRadius) {
						const factor = 1 - dMouse / influenceRadius;
						dotSize = 2.0 + factor * 5.5;

						// Morph to Radiant Crimson Red on cursor proximity!
						rCol = Math.round(6 + (239 - 6) * factor);
						gCol = Math.round(182 * (1 - factor * 0.85));
						bCol = Math.round(212 * (1 - factor * 0.85));
						alpha = 0.35 + factor * 0.65;

						// Glowing halo around active red dots
						if (factor > 0.4) {
							dotCtx.fillStyle = `rgba(239, 68, 68, ${0.15 * factor})`;
							dotCtx.beginPath();
							dotCtx.arc(x, y, dotSize * 2.2, 0, Math.PI * 2);
							dotCtx.fill();
						}
					} else {
						const wave = Math.sin(x * 0.008 + y * 0.008 + gridTime) * 0.5 + 0.5;
						alpha += wave * 0.12;
					}

					dotCtx.fillStyle = `rgba(${rCol}, ${gCol}, ${bCol}, ${alpha})`;
					dotCtx.beginPath();
					dotCtx.arc(x, y, dotSize, 0, Math.PI * 2);
					dotCtx.fill();
				}
			}
		};
		animateDotGrid();

		// ────── 2. TOWERING 3D "DIGITECH" TYPOGRAPHY BEHIND ROBOT ──────
		let is3DConfigured = false;
		function tryConfigure3DText() {
			if (is3DConfigured) return true;
			if (!app || !app._scene) return false;

			let logoGroup = null;
			let shapeMat = null;

			app._scene.traverse((obj) => {
				const name = (obj.name || '').toLowerCase();
				if (name === 'logo') logoGroup = obj;
				if (obj.name === 'Shape 0' && obj.material && !shapeMat) {
					shapeMat = obj.material;
				}
			});

			if (!logoGroup || !shapeMat) return false;

			// Hide original NEXBOT shapes
			logoGroup.children.forEach((c) => {
				if (c.name && c.name.startsWith('Shape')) {
					c.visible = false;
				}
			});
			logoGroup.visible = true;

			if (logoGroup.getObjectByName('DIGITECH_3D_TEXT')) {
				is3DConfigured = true;
				return true;
			}

			const fontLoader = new FontLoader();
			fontLoader.load('/fonts/gentilis_bold.typeface.json', (font) => {
				console.log('3D Font loaded, generating towering DIGITECH 3D TextGeometry...');
				const textGeo = new TextGeometry('DIGITECH', {
					font: font,
					size: 480,
					height: 100,
					curveSegments: 6,
					bevelEnabled: true,
					bevelThickness: 15,
					bevelSize: 10,
					bevelOffset: 0,
					bevelSegments: 3
				});
				textGeo.center();

				const textMesh = new THREE.Mesh(textGeo, shapeMat);
				textMesh.name = 'DIGITECH_3D_TEXT';
				// Position in logo group space (logo pos is 0, 146, -1000, scale 0.3)
				// y: 500 places the giant text towering proudly across the upper background
				textMesh.position.set(0, 500, 0);
				textMesh.frustumCulled = false;

				logoGroup.add(textMesh);
				is3DConfigured = true;
				if (app.requestRender) app.requestRender();
				console.log('Towering DIGITECH 3D text rendered behind robot mascot!');
			}, undefined, (err) => {
				console.error('Error loading 3D font:', err);
			});

			return true;
		}

		app.addEventListener && app.addEventListener("load", tryConfigure3DText);
		const checkSceneInterval = setInterval(() => {
			if (tryConfigure3DText()) {
				clearInterval(checkSceneInterval);
			}
		}, 150);
		setTimeout(() => clearInterval(checkSceneInterval), 15000);

		fetch('/spline-robot.bin')
			.then(res => {
				if (!res.ok) throw new Error('HTTP ' + res.status + ' loading 3D binary');
				return res.arrayBuffer();
			})
			.then(buf => app.start(new Uint8Array(buf))).then(() => { console.log("app.start completed!"); tryConfigure3DText(); }).catch(console.error);

	</script>
</body>

</html>
